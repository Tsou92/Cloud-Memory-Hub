[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project]
name = "cloud-memory-hub"
version = "0.1.1"
description = "NAS deployment boundary for the reused MemHub core"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "one-memory",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "mcp==2.3.0",
]

[project.scripts]
cloud-memory-hub = "cloud_memory_hub.__main__:main"
cloud-memory-connector = "cloud_memory_hub.connector:main"
cloud-memory-agent = "cloud_memory_hub.agent_cli:main"
cloud-memory-mcp = "cloud_memory_hub.agent_mcp:main"
cloud-memory-setup = "cloud_memory_hub.setup_cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv.sources]
one-memory = { path = "../../.local/upstream/hy-memory/memhub/apps/core", editable = true }
hy-memory = { path = "../../.local/upstream/hy-memory", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

# Preserve the reviewed upstream dependency set, including conditional dependencies.
[tool.uv]
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.45.1"]
