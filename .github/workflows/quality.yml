name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository tooling
        run: |
          python -m pip install uv==0.7.2
          uv sync --locked
      - name: Run repository quality checks
        run: make check

  onboarding:
    name: Agent setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify dependency-free connection installer and bootstrap
        env:
          CMH_TEST_BOOTSTRAP_RUNTIME: "1"
        run: python -m unittest discover -s tests -p "test_onboarding_*.py" -v

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: python -m pip install uv==0.12.5
      - name: Check upstream provenance and Hub integration
        run: make check-runtime
      - name: Run upstream Core PR regressions with verified model assets
        run: make check-upstream
      - name: Verify persisted reconciliation inputs across processes
        run: make probe-reconcile-graph
      - name: Verify chat history inputs across processes
        run: make probe-chat-history
      - name: Verify installed chat history source proof
        run: make probe-chat-graph
      - name: Native chat reconciliation evidence and replay
        run: make probe-chat-reconcile
      - name: Memory version origins on all native backends
        run: make check-memory-origins
      - name: Persisted native memory origin and replay
        run: make probe-memory-origins
      - name: Verify ordinary memory input ancestry across processes
        run: make probe-memory-graph
      - name: Verify native basic profile side effects and durable replay
        run: make probe-profile-evidence
      - name: Verify scoped profile ancestry and no-write backfill
        run: make probe-profile-graph
      - name: Verify derived writes complete before SDK outcomes and maintenance
        run: make probe-derived-lifecycle
      - name: Verify reused web components and fresh SDK startup
        run: make check-web
      - name: Build Linux amd64 image, verify offline model and restart persistence
        run: make check-container
