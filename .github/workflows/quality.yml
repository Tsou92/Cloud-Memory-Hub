name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository tooling
        run: |
          python -m pip install uv==0.7.2
          uv sync --locked
      - name: Run repository quality checks
        run: make check

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: python -m pip install uv==0.12.5
      - name: Check upstream provenance and Hub integration
        run: make check-runtime
      - name: Run reused authentication, capture, search and restore regressions
        working-directory: .local/upstream/hy-memory/memhub
        run: >-
          uv run --no-project -- bash scripts/run-tests-isolated.sh core
          tests/test_auth.py tests/test_managed_restore.py tests/test_live_capture.py
          tests/test_memory_write_registry.py tests/test_context_search.py -q
      - name: Build Linux amd64 image and verify restart persistence
        run: make check-container
