[project]
name = "cloud-memory-hub-tooling"
version = "0.0.0"
description = "Repository quality tooling; not the product runtime"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "detect-secrets==1.5.0",
  "ruff==0.14.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
